<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Degrés de rouges et nuances néon -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d14"/>
      <stop offset="100%" stop-color="#16192b"/>
    </linearGradient>

    <linearGradient id="badge-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="50%" stop-color="#ff2a00"/>
      <stop offset="100%" stop-color="#800022"/>
    </linearGradient>

    <linearGradient id="car-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a0018"/>
      <stop offset="30%" stop-color="#c40030"/>
      <stop offset="60%" stop-color="#ff0044"/>
      <stop offset="85%" stop-color="#ff2a6d"/>
      <stop offset="100%" stop-color="#ff5588"/>
    </linearGradient>

    <linearGradient id="fire-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ff0044" stop-opacity="0.3"/>
      <stop offset="25%" stop-color="#ff3300" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#ffaa00"/>
      <stop offset="85%" stop-color="#ffee00"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="neon-glow-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#ff00aa"/>
    </linearGradient>

    <!-- Filtres d'effets néon & flammes -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="fire-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fond principal -->
  <rect width="800" height="500" rx="16" fill="url(#bg-grad)"/>

  <!-- Grille technologique subtile -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M 0 100 L 800 100 M 0 200 L 800 200 M 0 300 L 800 300 M 0 400 L 800 400"/>
    <path d="M 150 0 L 150 500 M 300 0 L 300 500 M 450 0 L 450 500 M 600 0 L 600 500 M 750 0 L 750 500"/>
  </g>

  <!-- Blason / Écusson dynamique arrière -->
  <g transform="translate(400, 230)">
    <path d="M -260,-130 L 160,-130 L 260,-40 L 180,130 L 0,180 L -180,130 L -260,-40 Z"
          fill="#10121d" stroke="url(#badge-border)" stroke-width="5" stroke-linejoin="round" filter="url(#neon-glow)"/>
    <path d="M -245,-118 L 150,-118 L 243,-35 L 168,118 L 0,165 L -168,118 L -245,-35 Z"
          fill="#151828" stroke="#ff0055" stroke-opacity="0.25" stroke-width="2"/>
  </g>

  <!-- FLAMMES ET EFFET DE DRIFT (Derrière la F1) -->
  <g id="fire-effects" filter="url(#fire-glow)">
    <!-- Traînée principale de feu et fumée enflammée -->
    <path d="M 520,270 C 580,260 640,210 730,195 C 680,225 650,255 750,235 C 690,265 630,275 700,305 C 630,305 580,325 510,315 C 550,300 570,295 520,270 Z" fill="url(#fire-grad)"/>
    <path d="M 540,280 C 600,270 650,230 750,210 C 700,235 680,260 760,245 C 700,270 650,280 710,305 C 640,300 600,310 540,280 Z" fill="#ffaa00"/>
    <path d="M 560,285 C 610,275 660,245 730,225 C 690,245 680,260 740,255 C 680,270 640,275 670,290 C 620,290 590,295 560,285 Z" fill="#ffffff"/>

    <!-- Friction de Drift au sol -->
    <path d="M 270,360 Q 420,370 570,338 C 630,328 690,332 740,318 C 660,342 540,365 400,365 C 320,365 280,360 270,360 Z" fill="#ff3300" opacity="0.85"/>
    <path d="M 340,355 Q 460,362 580,335 C 640,328 690,330 730,320 C 660,338 560,355 440,357 Z" fill="#ffcc00"/>

    <!-- Étincelles dynamiques -->
    <circle cx="610" cy="215" r="4" fill="#ffee00"/>
    <circle cx="660" cy="195" r="3" fill="#ff7700"/>
    <circle cx="700" cy="175" r="2" fill="#ff0055"/>
    <circle cx="640" cy="315" r="5" fill="#ffaa00"/>
    <circle cx="720" cy="285" r="3" fill="#ffee00"/>
    <circle cx="750" cy="225" r="4" fill="#ffffff"/>
  </g>

  <!-- VOITURE DE F1 -->
  <g id="f1-car" transform="translate(10, 10)">
    <!-- Ombre sous la voiture -->
    <ellipse cx="380" cy="355" rx="220" ry="14" fill="#000000" opacity="0.65"/>

    <!-- Aileron Arrière -->
    <g id="rear-wing">
      <polygon points="560,220 620,210 610,275 550,280" fill="#7a0018"/>
      <polygon points="565,223 615,214 607,270 557,275" fill="url(#car-red)"/>
      <polygon points="530,225 615,215 613,225 530,233" fill="#ff0055"/>
      <polygon points="535,238 610,229 608,236 535,243" fill="#c40030"/>
      <polygon points="520,265 535,245 545,245 530,268" fill="#111116"/>
    </g>

    <!-- Fond plat / Diffuseur -->
    <path d="M 220,335 L 530,330 L 510,345 L 200,345 Z" fill="#0d0d13"/>
    <path d="M 210,342 L 500,338 L 490,345 L 205,345 Z" fill="#ff0055" filter="url(#neon-glow)"/>

    <!-- Châssis & Carrosserie -->
    <path d="M 150,315 C 190,305 260,295 320,290 C 380,285 410,260 450,255 C 480,252 520,255 540,265 L 520,310 C 440,320 340,325 210,325 Z" fill="url(#car-red)"/>

    <!-- Nuances de rouge et reflets de lumière -->
    <path d="M 160,313 C 210,303 260,293 320,288 C 375,283 405,260 445,257 C 475,255 505,258 520,265 L 515,272 C 495,266 470,264 440,268 C 395,274 365,293 310,296 C 250,300 195,310 160,313 Z" fill="#ff6688"/>
    <path d="M 230,323 C 330,322 420,317 490,308 L 505,318 C 430,325 330,328 210,326 Z" fill="#4a0011"/>
    <path d="M 330,290 C 370,275 410,270 450,270 C 480,270 510,280 525,290 L 510,310 C 480,300 440,295 390,295 C 360,295 340,292 330,290 Z" fill="#b3002d"/>

    <!-- Cockpit, Casque & Halo -->
    <ellipse cx="380" cy="275" rx="35" ry="12" fill="#0a0a10"/>
    <circle cx="375" cy="272" r="9" fill="#ffdd00"/>
    <path d="M 370,272 L 382,272 L 380,275 L 368,275 Z" fill="#111"/>
    <path d="M 340,280 C 350,265 370,260 410,263 C 415,263 410,268 395,268 C 365,268 352,272 345,282 Z" fill="#ff0055" filter="url(#neon-glow)"/>
    <path d="M 380,262 L 380,275 L 375,275 L 375,262 Z" fill="#7a0018"/>

    <!-- Entrée d'air supérieure -->
    <path d="M 420,258 C 435,235 455,232 475,235 C 470,245 465,255 460,260 Z" fill="#2d000a"/>
    <polygon points="432,253 445,240 455,242 442,255" fill="#ff0055"/>
    <ellipse cx="442" cy="248" rx="4" ry="5" fill="#000"/>

    <!-- Aileron Avant -->
    <g id="front-wing">
      <path d="M 100,325 L 180,315 L 220,330 L 130,340 Z" fill="#c40030"/>
      <path d="M 90,328 L 175,318 L 185,323 L 100,333 Z" fill="#ff2a6d"/>
      <polygon points="90,310 120,305 115,335 85,338" fill="#ff0055" filter="url(#neon-glow)"/>
      <polygon points="93,313 117,308 112,333 88,335" fill="#7a0018"/>
      <path d="M 110,323 L 180,314 L 178,318 L 108,327 Z" fill="#ffffff"/>
      <path d="M 120,320 L 185,311 L 183,314 L 118,323 Z" fill="#ff0055"/>
    </g>

    <!-- Suspension Avant -->
    <line x1="200" y1="320" x2="160" y2="300" stroke="#555" stroke-width="3"/>
    <line x1="210" y1="325" x2="170" y2="330" stroke="#333" stroke-width="3"/>

    <!-- Roue Avant -->
    <g id="front-wheel">
      <ellipse cx="165" cy="315" rx="22" ry="38" fill="#1a1a24" stroke="#2a2a38" stroke-width="2"/>
      <ellipse cx="165" cy="315" rx="17" ry="30" fill="#0d0d12"/>
      <ellipse cx="165" cy="315" rx="10" ry="18" fill="#b3002d"/>
      <ellipse cx="165" cy="315" rx="6" ry="11" fill="#111"/>
      <ellipse cx="165" cy="315" rx="13" ry="23" fill="none" stroke="#ff0055" stroke-width="1.5"/>
    </g>

    <!-- Suspension Arrière -->
    <line x1="480" y1="300" x2="510" y2="280" stroke="#555" stroke-width="4"/>
    <line x1="470" y1="315" x2="500" y2="320" stroke="#333" stroke-width="4"/>

    <!-- Roue Arrière en Drift -->
    <g id="rear-wheel">
      <ellipse cx="505" cy="300" rx="30" ry="50" fill="#14141c" stroke="#ff3300" stroke-width="1.5"/>
      <ellipse cx="505" cy="300" rx="23" ry="40" fill="#0a0a0f"/>
      <ellipse cx="505" cy="300" rx="14" ry="24" fill="#c40030"/>
      <ellipse cx="505" cy="300" rx="8" ry="14" fill="#1a1a24"/>
      <ellipse cx="505" cy="300" rx="17" ry="29" fill="none" stroke="#ffaa00" stroke-width="2" filter="url(#neon-glow)"/>
    </g>
  </g>

  <!-- LIGNES DE VITESSE EN NEON -->
  <g id="speed-lines" stroke-linecap="round">
    <line x1="100" y1="375" x2="480" y2="375" stroke="#ff0055" stroke-width="3" opacity="0.8" filter="url(#neon-glow)"/>
    <line x1="220" y1="390" x2="620" y2="390" stroke="#ff5500" stroke-width="2" opacity="0.6"/>
    <line x1="50"  y1="360" x2="280" y2="360" stroke="#ff0055" stroke-width="1.5" opacity="0.5"/>
    <line x1="520" y1="260" x2="680" y2="240" stroke="#ffee00" stroke-width="2" opacity="0.7" filter="url(#neon-glow)"/>
    <line x1="490" y1="240" x2="630" y2="225" stroke="#ff0055" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- TYPOGRAPHIE DU LOGO WEB -->
  <g id="logo-text" transform="translate(400, 435)">
    <text x="0" y="0"
          font-family="'Montserrat', 'Arial Black', sans-serif"
          font-size="28"
          font-weight="900"
          font-style="italic"
          letter-spacing="6"
          text-anchor="middle"
          fill="#ffffff"
          filter="url(#neon-glow)">
      APEX<tspan fill="#ff0055">RACING</tspan>
    </text>
    <text x="0" y="20"
          font-family="'Arial', sans-serif"
          font-size="10"
          font-weight="700"
          letter-spacing="10"
          text-anchor="middle"
          fill="#ffaa00"
          opacity="0.9">
      DRIFT DIVISION
    </text>
  </g>
</svg>
